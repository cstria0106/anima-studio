name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/version mismatch" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
      - run: bun run build:exe
      - name: Smoke test single EXE
        shell: pwsh
        run: .\scripts\smoke-portable.ps1 -Executable .\dist\AnimaStudio.exe
      - name: Create checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\AnimaStudio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AnimaStudio.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/AnimaStudio.exe
            dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ""
          generate_release_notes: false
          files: |
            dist/AnimaStudio.exe
            dist/SHA256SUMS.txt
